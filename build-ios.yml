name: Nexi iOS bauen
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo prebuild --platform ios
      - name: App ohne Signatur bauen
        run: |
          cd ios
          xcodebuild -workspace Nexi.xcworkspace -scheme Nexi -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/Nexi.app Payload/
          zip -r Nexi.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Nexi-ipa
          path: ios/Nexi.ipa
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app


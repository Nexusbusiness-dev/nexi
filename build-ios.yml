name: Nexi iOS bauen
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - run: npm install --legacy-peer-deps
      - run: npx expo prebuild --platform ios --clean
      - name: App ohne Signatur bauen
        run: |
          set -eo pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE | Scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r Nexi.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Nexi-ipa
          path: ios/Nexi.ipa

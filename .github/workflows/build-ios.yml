name: Nexi iOS bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Xcode 16.4 wählen
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pakete installieren
        run: npm install

      - name: Expo-Abhängigkeiten prüfen
        run: npx expo install --check

      - name: iOS-Projekt erzeugen
        run: npx expo prebuild --platform ios --clean

      - name: Podfile reparieren
        working-directory: ios
        run: |
          ruby <<'RUBY'
          s = File.read("Podfile")
          fix = <<-FIX
            installer.pods_project.targets.each do |t|
              t.build_configurations.each do |c|
                c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
                if t.name == 'fmt'
                  c.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++17'
                end
              end
            end
          FIX
          s.sub!("post_install do |installer|\n", "post_install do |installer|\n" + fix)
          File.write("Podfile", s)
          RUBY
          pod install

      - name: App ohne Signatur bauen
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Nexi.xcworkspace \
            -scheme Nexi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: IPA paketieren
        working-directory: ios
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Nexi.app"
          test -d "$APP_PATH" || { echo "Nexi.app wurde nicht gefunden"; exit 1; }
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/Nexi.app
          cd ipa
          zip -r ../Nexi-ipa.ipa Payload
          cd ..
          test -s Nexi-ipa.ipa

      - name: IPA als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Nexi-ipa
          path: ios/Nexi-ipa.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Fehler anzeigen
        if: failure()
        working-directory: ios
        run: |
          echo "=== Relevante Fehlermeldungen ==="
          grep -Ein "error:|Error:|Unable to resolve|cannot be found|Command .* failed" build.log | tail -n 60 || true
          echo "=== Ende des Build-Logs ==="
          tail -n 100 build.log

name: Nexi iOS bauen
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 16.4 auswählen
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Node-Abhängigkeiten installieren
        run: npm install

      - name: iOS Native-Projekt erzeugen
        run: npx expo prebuild --platform ios

      - name: Pods installieren
        run: |
          cd ios
          ruby -e "File.write('Podfile', File.read('Podfile').gsub(/platform\\s+:ios,\\s*['\"][^'\"]+['\"]/, \"platform :ios, '12.0'\"))"
          pod install --repo-update

      - name: App ohne Signatur bauen
        run: |
          cd ios
          xcodebuild -workspace Nexi.xcworkspace -scheme Nexi -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/Nexi.app Payload/
          zip -r Nexi.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Nexi-ipa
          path: ios/Nexi.ipa
